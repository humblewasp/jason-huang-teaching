<script>
(() => {
  'use strict';
  const all = JSON.parse(document.getElementById('profile-data').textContent);
  const media = JSON.parse(document.getElementById('profile-images').textContent);
  const stage = document.getElementById('stage');
  const nav = document.getElementById('reader-nav');
  const dialog = document.getElementById('cert-dialog');
  const order = ['index','about','teaching-style','experience','ai','certificates','beyond'];
  let lang = 'zh';
  let current = null;
  const safe = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const loc = () => all[lang];
  const img = (key, alt, cls='') => media[key] ? '<img src="'+media[key]+'" alt="'+safe(alt)+'" class="'+cls+'">' : '';
  const heading = (k, title, main=false) => (k ? '<p class="kicker">'+safe(k)+'</p>' : '')+'<'+(main?'h1':'h2')+' class="title" tabindex="-1">'+safe(title)+'</'+(main?'h1':'h2')+'>';
  const list = (xs, cls='') => '<ul class="'+cls+'">'+xs.map(x=>'<li>'+safe(x)+'</li>').join('')+'</ul>';
  const sub = text => '<h3 class="sub-title">'+safe(text)+'</h3>';
  function entry(x) {
    return '<article class="entry"><div class="period">'+safe(x.period)+'</div><h3>'+safe(x.company)+'</h3><p class="role">'+safe(x.role)+'</p>'+list(x.details)+'</article>';
  }
  function certs(xs) {
    return '<div class="certificate-grid">'+xs.map(x=>'<figure class="certificate">'+(media[x.image] ? '<button type="button" data-cert="'+safe(x.id)+'" aria-label="'+safe(loc().enlarge+' '+x.title)+'">'+img(x.image,x.title)+'</button>' : '<div class="missing-image">'+safe(x.missing || loc().missing)+'</div>')+'<figcaption>'+safe(x.title)+(x.note?'<small>'+safe(x.note)+'</small>':'')+'</figcaption></figure>').join('')+'</div>';
  }
  function activityList(xs) {
    return '<div class="activity-list">'+xs.map(([k,v,path,alt])=>'<figure class="activity">'+img(path,alt)+'<figcaption><strong>'+safe(k)+'</strong><p>'+safe(v)+'</p></figcaption></figure>').join('')+'</div>';
  }
  function projectCard(project) {
    const behavior=project.download?' download="'+safe(project.download)+'"':' target="_blank" rel="noopener noreferrer"';
    const symbol=project.download?'↓':'↗';
    const action=project.url?'<a href="'+safe(project.url)+'"'+behavior+'>'+safe(project.link)+' <span aria-hidden="true">'+symbol+'</span></a>':'';
    const status=project.access?(action?'<br>':'')+'<small>'+safe(project.access)+'</small>':'';
    return '<li class="project"><h3>'+safe(project.title)+'</h3><p>'+safe(project.description)+'</p>'+action+status+'</li>';
  }
  function build(id) {
    const d=loc(), t=d.titles[id];
    const name=heading(t[1],t[0]);
    let left='',right='';
    if(id==='index') {
      const email='<span>'+safe(d.emailLabel)+'</span><a href="mailto:'+safe(d.email)+'" aria-label="'+safe(d.emailLabel+' '+d.email)+'">'+safe(d.email)+'</a>';
      const phone=d.phone?'<span>'+safe(d.phoneLabel)+'</span><a href="tel:'+safe(d.phone.replace(/\s/g,''))+'" aria-label="'+safe(d.phoneLabel+' '+d.phone)+'">'+safe(d.phone)+'</a>':'';
      const identity='<div class="front-identity"><div class="front-name"><h1 class="name" tabindex="-1">'+safe(d.name)+'</h1><p class="alias">Jason</p></div><address class="front-contact">'+email+phone+'</address></div>';
      left=img('portrait',d.portraitAlt,'portrait')+identity+'<p class="intro">'+safe(d.intro)+'</p><div class="trait-block"><p class="short-label">'+safe(d.traitLabel)+'</p><dl class="trait-notes">'+d.traits.map(([k,v])=>'<div><dt>'+safe(k)+'</dt><dd>'+safe(v)+'</dd></div>').join('')+'</dl></div>';
      right=name+'<ol class="toc">'+order.slice(1).map((k,i)=>'<li><a href="#'+k+'"><span class="num">'+String(i+1).padStart(2,'0')+'</span><span><strong>'+safe(d.titles[k][0])+'</strong>'+(lang==='zh'?'<small>'+safe(d.titles[k][1])+'</small>':'')+'</span><span class="chev" aria-hidden="true">›</span></a></li>').join('')+'</ol>';
    } else if(id==='about') {
      left=name+d.about.map(x=>'<p class="lead">'+safe(x)+'</p>').join('');
      right=sub('Quick Profile')+'<dl class="facts">'+d.profile.map(([k,v])=>'<div><dt>'+safe(k)+'</dt><dd>'+safe(v)+'</dd></div>').join('')+'</dl>';
    } else if(id==='teaching-style') {
      left=name+'<p class="lead">'+safe(d.teachingTitle)+'</p><p class="teaching-line">'+safe(d.teachingNote)+'</p>';
      right=sub(d.styleLabel)+'<ol class="style-list">'+d.styles.map(([k,v])=>'<li><strong>'+safe(k)+'</strong><p>'+safe(v)+'</p></li>').join('')+'</ol>';
    } else if(id==='experience') {
      left=name+entry(d.experience[0]);
      right=d.experience.slice(1).map(entry).join('');
    } else if(id==='ai') {
      left=name+'<p class="lead">'+safe(d.aiIntro)+'</p>';
      right='<ol class="projects">'+d.projects.map(projectCard).join('')+'</ol>';
    } else if(id==='certificates') {
      left=name+certs(d.certificates.slice(0,2));
      right=certs(d.certificates.slice(2));
    } else if(id==='beyond') {
      left=name+activityList(d.activities.slice(0,2));
      right=activityList(d.activities.slice(2));
    }
    const s=document.createElement('section');
    s.className='spread'+(id==='index'?' front':'');s.dataset.page=id;
    s.setAttribute('aria-label',t[0]);
    s.innerHTML='<div class="sheet left'+(id==='index'?' front-left':'')+'">'+left+'</div><div class="sheet right">'+right+'</div>';
    return s;
  }
  function controls(index) {
    const d=loc();
    const control=(kind,n,label,arrow)=>{
      if(n<0||n>=order.length) return '<span class="control '+kind+'" aria-disabled="true">'+safe(label)+'</span>';
      return '<a class="'+kind+'" href="#'+order[n]+'" aria-label="'+safe(label+'：'+d.titles[order[n]][0])+'">'+(kind==='prev'?arrow+' ':'')+safe(label)+(kind==='next'?' '+arrow:'')+'</a>';
    };
    nav.innerHTML=control('prev',index-1,d.prev,'‹')+'<div class="page-count" aria-live="polite"><span class="current">'+(index+1)+'</span> / '+order.length+(index>0?' · <a class="contents" href="#index">'+safe(d.contents)+'</a>':'')+'</div>'+control('next',index+1,d.next,'›');
  }
  function go(id,animate=true,focus=true) {
    if(!order.includes(id))id='index';
    const old=stage.querySelector('.spread'),prev=order.indexOf(current),index=order.indexOf(id);
    const allowTurn=animate&&old&&prev!==index&&!matchMedia('(prefers-reduced-motion: reduce)').matches;
    const forward=index>prev, source=allowTurn?old.querySelector(forward?'.right':'.left').cloneNode(true):null;
    current=id;
    const next=build(id);stage.replaceChildren(next);controls(index);
    if(allowTurn) {
      if(matchMedia('(min-width: 761px)').matches) {
        const turn=document.createElement('div');turn.className='paper-turn '+(forward?'forward':'backward');
        turn.setAttribute('aria-hidden','true');turn.inert=true;
        const front=document.createElement('div');front.className='flip-face';front.append(source);
        const back=document.createElement('div');back.className='flip-face back';
        turn.append(front,back);stage.append(turn);
        turn.addEventListener('animationend',()=>turn.remove(),{once:true});
      } else next.classList.add('enter');
    }
    if(focus) { next.querySelector('h1,h2')?.focus({preventScroll:true});window.scrollTo(0,0); }
  }
  function fromHash() {const id=location.hash.slice(1);return order.includes(id)?id:'index';}
  function setLocale(next) {
    lang=next;document.documentElement.lang=lang==='zh'?'zh-CN':'en';
    document.getElementById('wordmark').textContent=loc().wordmark;
    const contact=document.getElementById('contact');
    contact.textContent=loc().contact;
    contact.href='mailto:'+loc().email;
    document.getElementById('languages').setAttribute('aria-label',loc().languageLabel);
    document.getElementById('dialog-close').textContent=loc().close;
    document.title=loc().documentTitle;
    document.querySelectorAll('[data-locale]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.locale===lang)));
    go(current||fromHash(),false,false);
  }
  document.querySelectorAll('[data-locale]').forEach(b=>b.addEventListener('click',()=>setLocale(b.dataset.locale)));
  window.addEventListener('hashchange',()=>go(fromHash()));
  document.addEventListener('keydown',e=>{
    if(e.altKey||e.metaKey||e.ctrlKey||e.shiftKey||dialog.open||e.target.closest?.('input,textarea,select,[contenteditable="true"]'))return;
    if(!['ArrowLeft','ArrowRight'].includes(e.key))return;
    const index=order.indexOf(current)+(e.key==='ArrowRight'?1:-1);
    if(index<0||index>=order.length)return;
    e.preventDefault();location.hash=order[index];
  });
  stage.addEventListener('click',e=>{
    const b=e.target.closest('[data-cert]');
    if(!b||b.closest('.paper-turn'))return;
    const c=loc().certificates.find(x=>x.id===b.dataset.cert);
    if(!c||!media[c.image])return;
    document.getElementById('cert-name').textContent=c.title;
    const photo=document.getElementById('cert-img');photo.src=media[c.image];photo.alt=c.title;dialog.showModal();
  });
  dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close();});
  setLocale('zh');
})();
</script>
